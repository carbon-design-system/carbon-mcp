<!doctype html>
<!-- Source for hero.png. IBM Plex comes from the Carbon CDN; the illustration is carbon-mcp.svg beside this file.
     Render at 2400x1200 with headless Chromium, run from the repository root:
       chromium --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files \
         --force-device-scale-factor=2 --window-size=1200,687 --virtual-time-budget=8000 \
         --screenshot=public/hero.png file://$PWD/public/hero.html
     then crop to 2400x1200 (new headless adds 87px of window chrome):
       magick public/hero.png -crop 2400x1200+0+0 +repage public/hero.png -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://1.www.s81c.com/common/carbon/plex/sans.css">
<style>
html,body{margin:0;width:1200px;height:600px;overflow:hidden;background:#ffffff;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#161616}
.copy{position:absolute;left:72px;top:0;width:470px;height:600px}
.eyebrow{position:absolute;top:92px;font-size:14px;font-weight:600;letter-spacing:.16px;color:#0f62fe}
.rule{position:absolute;top:124px;width:48px;height:3px;background:#0f62fe}
h1{position:absolute;top:150px;margin:0;font-size:64px;line-height:1.05;letter-spacing:-1.2px;font-weight:300;white-space:nowrap}
h1 b{font-weight:600}
.tag{position:absolute;top:246px;margin:0;font-size:24px;line-height:1.35;font-weight:400;color:#525252}
.props{position:absolute;top:428px;left:0;display:grid;grid-template-columns:auto auto;column-gap:28px;row-gap:12px;font-size:14px;font-weight:600;color:#161616}
.props span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:#0f62fe;margin-right:10px;vertical-align:1px}
.foot{position:absolute;top:516px;font-size:14px;color:#525252}
.art{position:absolute;left:600px;top:0;width:600px;height:600px;background:#edf5ff url('carbon-mcp.svg') no-repeat center/600px 600px}
.seam{position:absolute;left:600px;top:0;width:1px;height:600px;background:#d0e2ff}
</style></head><body>
<div class="copy">
  <div class="eyebrow">Carbon Design System</div><div class="rule"></div>
  <h1>Carbon <b>MCP</b></h1>
  <p class="tag">The Carbon Design System,<br>available to any AI agent.</p>
  <div class="props"><span>Instant Carbon expertise</span><span>Code that conforms</span><span>One source of truth</span><span>Works with any AI agent</span></div>
  <div class="foot">Remote MCP server  ·  Sign in with IBMid  ·  Hosted on IBM Cloud</div>
</div>
<div class="art"></div><div class="seam"></div>
</body></html>
